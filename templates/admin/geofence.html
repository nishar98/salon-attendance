{% extends "base.html" %}
{% block title %}Geofence Settings — Salon Attendance{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold text-gray-800 mb-6">Geofence Configuration</h1>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Map -->
    <div class="bg-white rounded-xl shadow-sm p-4">
        <div id="map" class="w-full h-64 rounded-lg"></div>
    </div>

    <!-- Settings form -->
    <div class="bg-white rounded-xl shadow-sm p-4">
        <form id="geofence-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
                <input type="number" id="geo-lat" step="0.0000001" required
                       class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
                <input type="number" id="geo-lon" step="0.0000001" required
                       class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Radius: <span id="radius-label">10</span> metres
                </label>
                <input type="range" id="geo-radius" min="5" max="50" value="10"
                       class="w-full" oninput="document.getElementById('radius-label').textContent=this.value; updateMap()">
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">
                Save Configuration
            </button>
        </form>
        <div id="geo-msg" class="mt-3 text-sm" style="display:none;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/geofence.js"></script>
{% endblock %}
