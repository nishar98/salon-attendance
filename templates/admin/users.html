{% extends "base.html" %}
{% block title %}Users — Salon Attendance{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-6">User Management</h1>

<!-- Add user -->
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-4">Add New Associate</h2>
    <form id="add-user-form" class="flex flex-wrap gap-3 items-end">
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Name</label>
            <input type="text" id="new-name" required class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500 w-44" placeholder="Full name">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Email</label>
            <input type="email" id="new-email" required class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500 w-52" placeholder="email@example.com">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Password</label>
            <input type="password" id="new-password" required minlength="8" class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500 w-40" placeholder="min 8 chars">
        </div>
        <button type="submit" class="bg-primary-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-primary-700 transition-colors">Add User</button>
    </form>
    <div id="add-user-msg" class="mt-3 text-sm" style="display:none;"></div>
</div>

<!-- Users list -->
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="px-5 py-4 border-b border-gray-100">
        <h2 class="text-sm font-semibold text-gray-700">Team Members</h2>
    </div>
    <div id="users-list" class="p-5">
        <div class="flex items-center justify-center py-8"><div class="spinner"></div></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    loadUsers();

    document.getElementById('add-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('add-user-msg');
        const name = document.getElementById('new-name').value.trim();
        const email = document.getElementById('new-email').value.trim();
        const password = document.getElementById('new-password').value;

        const res = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password }) });
        const data = await res.json();
        msg.style.display = 'block';
        if (res.ok) { msg.className = 'mt-3 text-sm text-green-600 font-medium'; msg.textContent = `✓ ${data.name} added!`; e.target.reset(); loadUsers(); }
        else { msg.className = 'mt-3 text-sm text-red-600 font-medium'; msg.textContent = data.detail || 'Failed.'; }
    });

    async function loadUsers() {
        const container = document.getElementById('users-list');
        try {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if (!data.users?.length) { container.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">No users yet.</p>'; return; }
            let html = '<div class="divide-y divide-gray-50">';
            for (const u of data.users) {
                const isActive = u.status === 'active';
                const badgeColor = isActive ? 'green' : 'gray';
                const initial = u.name.charAt(0).toUpperCase();
                const roleColor = u.role === 'admin' ? 'primary' : 'gray';
                html += `<div class="flex items-center justify-between py-3">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-${roleColor}-100 rounded-full flex items-center justify-center"><span class="text-sm font-bold text-${roleColor}-600">${initial}</span></div>
                        <div>
                            <p class="text-sm font-medium text-gray-900">${u.name}</p>
                            <p class="text-xs text-gray-500">${u.email} · ${u.role}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-${badgeColor}-100 text-${badgeColor}-700">${u.status}</span>
                        ${u.role !== 'admin' ? `<button onclick="toggleUser('${u.id}','${u.status}')" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-600 transition-colors">${isActive ? 'Deactivate' : 'Activate'}</button>` : ''}
                    </div>
                </div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm text-center py-8">Failed to load.</p>'; }
    }

    async function toggleUser(id, status) {
        await fetch(`/api/admin/users/${id}/status`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: status === 'active' ? 'inactive' : 'active' }) });
        loadUsers();
    }
</script>
{% endblock %}
