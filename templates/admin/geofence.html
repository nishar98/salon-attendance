{% extends "base.html" %}
{% block title %}Geofence — Salon Attendance{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-6">Geofence Configuration</h1>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Map -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <h2 class="text-sm font-semibold text-gray-700 mb-3">Location Preview</h2>
        <div id="map" class="w-full h-72 rounded-xl overflow-hidden border border-gray-200"></div>
        <p class="text-xs text-gray-400 mt-2">Click the map to set a new location</p>
    </div>

    <!-- Settings -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <h2 class="text-sm font-semibold text-gray-700 mb-4">Settings</h2>
        <form id="geofence-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1.5">Latitude</label>
                <input type="number" id="geo-lat" step="0.0000001" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1.5">Longitude</label>
                <input type="number" id="geo-lon" step="0.0000001" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1.5">Radius: <span id="radius-label" class="text-primary-600 font-semibold">10</span> metres</label>
                <input type="range" id="geo-radius" min="5" max="50" value="10" class="w-full accent-primary-600" oninput="document.getElementById('radius-label').textContent=this.value; updateMap()">
                <div class="flex justify-between text-xs text-gray-400 mt-1"><span>5m</span><span>50m</span></div>
            </div>
            <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-xl text-sm font-medium hover:bg-primary-700 focus:ring-4 focus:ring-primary-200 transition-all">
                Save Configuration
            </button>
        </form>
        <div id="geo-msg" class="mt-3 text-sm" style="display:none;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/geofence.js"></script>
{% endblock %}
