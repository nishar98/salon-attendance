{% extends "base.html" %}
{% block title %}Attendance Records — Salon Attendance{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-6">Attendance Records</h1>

<!-- Filters -->
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
    <div class="flex flex-wrap items-end gap-4">
        <div class="min-w-[180px]">
            <label class="block text-xs font-medium text-gray-500 mb-1.5">Associate</label>
            <select id="user-select" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary-500">
                <option value="">Select user...</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">From</label>
            <input type="date" id="att-start" class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">To</label>
            <input type="date" id="att-end" class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
        </div>
        <button onclick="loadAttendance()" class="bg-primary-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-primary-700 transition-colors">View</button>
    </div>
</div>

<!-- Summary -->
<div id="summary-cards" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 text-center">
        <p class="text-xs font-medium text-gray-500 uppercase">Days Present</p>
        <p id="days-present" class="text-2xl font-bold text-green-600 mt-1">—</p>
    </div>
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 text-center">
        <p class="text-xs font-medium text-gray-500 uppercase">Total Hours</p>
        <p id="total-hours" class="text-2xl font-bold text-primary-600 mt-1">—</p>
    </div>
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 text-center">
        <p class="text-xs font-medium text-gray-500 uppercase">Avg Hours/Day</p>
        <p id="avg-hours" class="text-2xl font-bold text-gray-700 mt-1">—</p>
    </div>
</div>

<!-- Table -->
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <div id="attendance-content" class="p-5">
        <div class="text-center py-12">
            <svg class="w-12 h-12 text-gray-200 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <p class="text-gray-400 text-sm">Select a user and date range</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    loadUsers(); setDefaultDates();

    async function loadUsers() {
        const res = await fetch('/api/admin/users'); if (!res.ok) return;
        const data = await res.json();
        const sel = document.getElementById('user-select');
        for (const u of data.users) { if (u.role === 'associate') { const o = document.createElement('option'); o.value = u.id; o.textContent = u.name; sel.appendChild(o); } }
    }

    function setDefaultDates() {
        const now = new Date(), first = new Date(now.getFullYear(), now.getMonth(), 1);
        document.getElementById('att-start').value = first.toISOString().split('T')[0];
        document.getElementById('att-end').value = now.toISOString().split('T')[0];
    }

    async function loadAttendance() {
        const userId = document.getElementById('user-select').value;
        const start = document.getElementById('att-start').value, end = document.getElementById('att-end').value;
        const content = document.getElementById('attendance-content'), summary = document.getElementById('summary-cards');
        if (!userId) { content.innerHTML = '<p class="text-red-500 text-sm text-center py-4">Please select a user.</p>'; return; }
        content.innerHTML = '<div class="flex items-center justify-center py-10"><div class="spinner"></div></div>';

        const res = await fetch(`/api/admin/users/${userId}/attendance?start=${start}&end=${end}`);
        if (!res.ok) { content.innerHTML = '<p class="text-red-500 text-sm text-center py-4">Failed to load.</p>'; summary.classList.add('hidden'); return; }
        const data = await res.json();

        summary.classList.remove('hidden');
        document.getElementById('days-present').textContent = data.days_present;
        document.getElementById('total-hours').textContent = data.total_hours + 'h';
        document.getElementById('avg-hours').textContent = (data.days_present > 0 ? (data.total_hours / data.days_present).toFixed(1) : '0') + 'h';

        if (!data.records?.length) { content.innerHTML = '<p class="text-gray-400 text-sm text-center py-10">No records</p>'; return; }

        let html = `<h3 class="text-sm font-semibold text-gray-700 mb-3">${data.user_name}</h3><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b border-gray-100"><th class="pb-3 pr-4">Date</th><th class="pb-3 pr-4">In</th><th class="pb-3 pr-4">Out</th><th class="pb-3">Hours</th></tr></thead><tbody class="divide-y divide-gray-50">`;
        for (const r of data.records) {
            const cls = r.hours === 'In Progress' ? 'text-green-600 font-medium' : 'text-gray-600';
            html += `<tr class="hover:bg-gray-50"><td class="py-3 pr-4 font-medium text-gray-900">${r.date}</td><td class="py-3 pr-4 text-gray-600">${r.punch_in||'—'}</td><td class="py-3 pr-4 text-gray-600">${r.punch_out||'—'}</td><td class="py-3 ${cls}">${r.hours||'—'}</td></tr>`;
        }
        html += '</tbody></table></div>';
        content.innerHTML = html;
    }
</script>
{% endblock %}
