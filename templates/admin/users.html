{% extends "base.html" %}
{% block title %}User Management — Salon Attendance{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold text-gray-800 mb-6">User Management</h1>

<!-- Add user form -->
<div class="bg-white rounded-xl shadow-sm p-4 mb-6">
    <h2 class="text-sm font-medium text-gray-600 mb-3">Add New Associate</h2>
    <form id="add-user-form" class="flex flex-wrap gap-3 items-end">
        <div>
            <label class="block text-xs text-gray-500 mb-1">Name</label>
            <input type="text" id="new-name" required class="border rounded-lg px-3 py-2 text-sm" placeholder="Full name">
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">Email</label>
            <input type="email" id="new-email" required class="border rounded-lg px-3 py-2 text-sm" placeholder="email@example.com">
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">Password</label>
            <input type="password" id="new-password" required minlength="8" class="border rounded-lg px-3 py-2 text-sm" placeholder="min 8 chars">
        </div>
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700">Add</button>
    </form>
    <div id="add-user-msg" class="mt-2 text-sm hidden"></div>
</div>

<!-- Users list -->
<div class="bg-white rounded-xl shadow-sm p-4">
    <h2 class="text-sm font-medium text-gray-600 mb-3">Associates</h2>
    <div id="users-list">
        <p class="text-gray-500 text-center py-4">Loading...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    loadUsers();

    document.getElementById('add-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('add-user-msg');
        const name = document.getElementById('new-name').value.trim();
        const email = document.getElementById('new-email').value.trim();
        const password = document.getElementById('new-password').value;

        const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password }),
        });
        const data = await res.json();
        msg.classList.remove('hidden');
        if (res.ok) {
            msg.className = 'mt-2 text-sm text-green-600';
            msg.textContent = `User ${data.name} created!`;
            e.target.reset();
            loadUsers();
        } else {
            msg.className = 'mt-2 text-sm text-red-600';
            msg.textContent = data.detail || 'Failed to create user.';
        }
    });

    async function loadUsers() {
        const container = document.getElementById('users-list');
        try {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if (!data.users || data.users.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No users yet.</p>';
                return;
            }
            let html = '<div class="space-y-2">';
            for (const u of data.users) {
                const statusColor = u.status === 'active' ? 'green' : 'red';
                html += `
                    <div class="flex items-center justify-between border-b py-2 last:border-0">
                        <div>
                            <p class="font-medium text-sm">${u.name}</p>
                            <p class="text-xs text-gray-500">${u.email} • ${u.role}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-${statusColor}-600 font-medium">${u.status}</span>
                            ${u.role !== 'admin' ? `
                            <button onclick="toggleUser('${u.id}', '${u.status}')"
                                    class="text-xs px-2 py-1 rounded border hover:bg-gray-50">
                                ${u.status === 'active' ? 'Deactivate' : 'Activate'}
                            </button>` : ''}
                        </div>
                    </div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = '<p class="text-red-500 text-center py-4">Failed to load users.</p>';
        }
    }

    async function toggleUser(userId, currentStatus) {
        const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
        await fetch(`/api/admin/users/${userId}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus }),
        });
        loadUsers();
    }
</script>
{% endblock %}
