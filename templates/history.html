{% extends "base.html" %}
{% block title %}Attendance History — Salon Attendance{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold text-gray-900">My Attendance</h1>
    <input type="month" id="month-select" class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500">
</div>

<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <div id="history-content" class="p-5">
        <div class="flex items-center justify-center py-10">
            <div class="spinner"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const monthInput = document.getElementById('month-select');
    const content = document.getElementById('history-content');
    const now = new Date();
    monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    monthInput.addEventListener('change', loadHistory);
    loadHistory();

    async function loadHistory() {
        const [year, month] = monthInput.value.split('-');
        const start = `${year}-${month}-01`;
        const end = new Date(year, month, 1).toISOString().split('T')[0];
        content.innerHTML = '<div class="flex items-center justify-center py-10"><div class="spinner"></div></div>';

        try {
            const res = await fetch(`/api/punch/history?start=${start}&end=${end}`);
            if (!res.ok) { content.innerHTML = '<p class="text-red-500 text-center py-8 text-sm">Failed to load.</p>'; return; }
            const data = await res.json();
            if (!data.records || data.records.length === 0) {
                content.innerHTML = `<div class="text-center py-12"><svg class="w-12 h-12 text-gray-200 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p class="text-gray-400 text-sm">No records for this month</p></div>`;
                return;
            }
            let html = `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b border-gray-100"><th class="pb-3 pr-4">Date</th><th class="pb-3 pr-4">In</th><th class="pb-3 pr-4">Out</th><th class="pb-3">Hours</th></tr></thead><tbody class="divide-y divide-gray-50">`;
            for (const r of data.records) {
                const outCell = r.punch_out || '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">In Progress</span>';
                html += `<tr class="hover:bg-gray-50"><td class="py-3 pr-4 font-medium text-gray-900">${r.date}</td><td class="py-3 pr-4 text-gray-600">${r.punch_in || '—'}</td><td class="py-3 pr-4 text-gray-600">${outCell}</td><td class="py-3 text-gray-600">${r.hours || '—'}</td></tr>`;
            }
            html += '</tbody></table></div>';
            content.innerHTML = html;
        } catch (err) { content.innerHTML = '<p class="text-red-500 text-center py-8 text-sm">Network error.</p>'; }
    }
</script>
{% endblock %}
